<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>教师节 · 给老师的一封信</title>

<style>

/* =========================
   基础
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 20%,
            #fffaf3 0%,
            #f8eee3 50%,
            #ead8c8 100%
        );

    color: #624b3e;
}


/* =========================
   页面
========================= */

.scene {
    width: 100%;
    height: 100vh;

    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* 背景花朵 */

.scene::before {
    content: "✿";

    position: absolute;

    left: 8%;
    top: 23%;

    font-size: 75px;

    color: rgba(165, 105, 82, 0.08);

    transform: rotate(-20deg);
}

.scene::after {
    content: "✿";

    position: absolute;

    right: 8%;
    bottom: 13%;

    font-size: 75px;

    color: rgba(165, 105, 82, 0.08);

    transform: rotate(20deg);
}


/* =========================
   标题
========================= */

.title {
    position: absolute;

    top: 7%;

    width: 100%;

    text-align: center;

    z-index: 50;
}

.title-main {
    font-family: serif;

    font-size: 27px;

    letter-spacing: 4px;

    color: #674a3c;
}

.title-sub {
    margin-top: 9px;

    font-size: 10px;

    letter-spacing: 4px;

    color: #a48675;
}


/* =========================
   信封
========================= */

.envelope {
    position: absolute;

    width: min(370px, 84vw);
    height: 245px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -35%);

    cursor: pointer;

    z-index: 10;

    /*
       注意：
       这里不能 overflow:hidden，
       否则打开以后信纸无法跑到信封上方。
    */
}


/* =========================
   信纸
========================= */

.letter {
    position: absolute;

    width: 90%;

    height: 370px;

    left: 5%;

    /*
       信纸一开始位于信封内部
    */
    top: 0;

    padding: 28px 25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.96),
            rgba(255,251,244,.98)
        );

    border:
        1px solid rgba(150,110,90,.18);

    border-radius: 5px;

    box-shadow:
        0 18px 40px rgba(80,52,40,.18);

    /*
       初始状态：
       z-index 很低，
       并且把信纸上方全部裁掉，
       所以完全看不到。
    */

    z-index: 2;

    clip-path:
        inset(245px 0 0 0);

    transform:
        translateY(0);

    transition:
        transform 1.15s cubic-bezier(.22,.61,.36,1),
        clip-path 0s linear 0.15s;

    overflow: hidden;
}


/* 信纸装饰 */

.letter::before {
    content: "✿";

    position: absolute;

    right: 18px;
    top: 12px;

    font-size: 19px;

    color: #b47e69;

    opacity: .6;
}


/* 信纸标题 */

.letter-title {
    text-align: center;

    font-family: serif;

    font-size: 20px;

    letter-spacing: 3px;

    color: #62483b;

    margin-bottom: 18px;
}


/* 信纸正文 */

.letter-content {
    font-family: serif;

    font-size: 15px;

    line-height: 1.9;

    color: #5f4c43;

    white-space: pre-wrap;

    word-break: break-all;
}


/* =========================
   信封主体
========================= */

.envelope-body {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 185px;

    background:
        linear-gradient(
            135deg,
            #dca792,
            #ca8d75
        );

    border-radius: 8px;

    box-shadow:
        0 18px 35px rgba(80,52,40,.22);

    z-index: 5;
}


/* =========================
   左右折角
========================= */

.fold-left {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 50%;
    height: 185px;

    background: #d29a82;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );

    z-index: 7;
}

.fold-right {
    position: absolute;

    right: 0;
    bottom: 0;

    width: 50%;
    height: 185px;

    background: #ce957c;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 7;
}


/* =========================
   信封上的文字
========================= */

.envelope-message {
    position: absolute;

    left: 50%;
    top: 38px;

    transform:
        translateX(-50%);

    width: 90%;

    text-align: center;

    color: #fff9f1;

    font-family: serif;

    font-size: 16px;

    line-height: 1.8;

    letter-spacing: 1px;

    text-shadow:
        0 1px 2px rgba(80,45,35,.15);

    z-index: 9;

    transition:
        opacity .35s ease;
}


/* =========================
   信封上盖
========================= */

.flap {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 150px;

    background: #dfad96;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:
        50% 0%;

    transition:
        transform 1s cubic-bezier(.22,.61,.36,1);

    z-index: 10;

    filter:
        drop-shadow(
            0 3px 4px rgba(80,50,40,.12)
        );
}


/* =========================
   火漆印
========================= */

.seal {
    position: absolute;

    width: 52px;
    height: 52px;

    left: 50%;
    top: 105px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #b97062,
            #914f47
        );

    color: #f9e8d7;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 22px;

    box-shadow:
        0 4px 9px rgba(73,40,34,.25);

    z-index: 15;

    transition:
        opacity .35s ease,
        transform .4s ease;
}


/* =========================
   点击以后
========================= */


/* 信封打开 */

.envelope.open .flap {
    transform:
        rotateX(180deg);
}


/* 信纸完全出现 */

.envelope.open .letter {

    /*
       取消裁切
    */

    clip-path:
        inset(0 0 0 0);

    /*
       信纸直接升到信封上方
    */

    transform:
        translateY(-350px);

    /*
       非常重要：
       信纸层级最高，
       所以信封不会挡住正文。
    */

    z-index: 30;
}


/* 信封文字消失 */

.envelope.open .envelope-message {
    opacity: 0;
}


/* 火漆消失 */

.envelope.open .seal {
    opacity: 0;

    transform:
        translateX(-50%)
        scale(.7);
}


/* =========================
   提示
========================= */

.hint {
    position: absolute;

    bottom: 7%;

    font-size: 13px;

    letter-spacing: 2px;

    color: #9a7968;

    z-index: 40;

    transition:
        opacity .4s ease;
}

.envelope.open + .hint {
    opacity: 0;
}


/* =========================
   手机
========================= */

@media (max-width: 500px) {

    .title {
        top: 6%;
    }

    .title-main {
        font-size: 22px;

        letter-spacing: 3px;
    }

    .title-sub {
        font-size: 9px;

        letter-spacing: 3px;
    }


    .envelope {

        width: 86vw;

        height: 225px;

        top: 52%;

        transform:
            translate(-50%, -35%);
    }


    /* 信纸 */

    .letter {

        width: 92%;

        left: 4%;

        height: 365px;

        padding:
            25px 20px;

        clip-path:
            inset(225px 0 0 0);
    }


    .letter-title {

        font-size: 19px;

        margin-bottom: 15px;
    }


    .letter-content {

        font-size: 14px;

        line-height: 1.85;
    }


    /* 信封 */

    .envelope-body {

        height: 170px;
    }

    .fold-left,
    .fold-right {

        height: 170px;
    }


    .flap {

        height: 138px;
    }


    /* 信封文字 */

    .envelope-message {

        top: 28px;

        font-size: 14px;

        line-height: 1.8;
    }


    /* 火漆 */

    .seal {

        top: 94px;

        width: 48px;

        height: 48px;

        font-size: 20px;
    }


    /*
       手机打开以后，
       信纸向上移动。
       
       这里让信纸完整出现在
       手机屏幕中间。
    */

    .envelope.open .letter {

        transform:
            translateY(-315px);

        z-index: 30;
    }
}

</style>
</head>


<body>


<div class="scene">


    <!-- =========================
         标题
    ========================= -->

    <div class="title">

        <div class="title-main">
            教师节 · 给老师的一封信
        </div>

        <div class="title-sub">
            THANK YOU, TEACHER
        </div>

    </div>


    <!-- =========================
         信封
    ========================= -->

    <div
        class="envelope"
        id="envelope"
    >


        <!-- =========================
             信纸
        ========================= -->

        <div class="letter">

            <div class="letter-title">
                老师，您好
            </div>


            <div class="letter-content">老师，教师节快乐呀!!

上学期见不到您我们真的很想念您，还好大四又能上您的课了，我会好好听讲的😊

您无疑是我最喜欢的老师，当然我们许多人都会这么想的嘻嘻嘻

您以后有什么任务可以尽情吩咐我，我很开心能帮助到您❤️

愿您身体安康，平安幸福，教师节快乐！</div>

        </div>


        <!-- =========================
             信封主体
        ========================= -->

        <div class="envelope-body"></div>


        <!-- =========================
             信封上的文字
        ========================= -->

        <div class="envelope-message">

            教师节快乐！<br>

            祝您桃李满天下<br>

            家庭事业顶呱呱

        </div>


        <!-- 左右折角 -->

        <div class="fold-left"></div>

        <div class="fold-right"></div>


        <!-- 上盖 -->

        <div class="flap"></div>


        <!-- 火漆 -->

        <div class="seal">
            ✿
        </div>


    </div>


    <!-- 点击提示 -->

    <div class="hint">
        点击信封，打开这封信
    </div>


</div>


<script>

/* =========================
   点击信封
========================= */

const envelope =
    document.getElementById("envelope");


envelope.addEventListener(
    "click",
    function () {

        envelope.classList.toggle("open");

    }
);

</script>


</body>
</html>
