<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>教师节 · 给老师的一封信</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    color:#684f49;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,255,255,.96),
            rgba(255,247,238,.82) 45%,
            rgba(246,225,211,.98) 100%
        );

    overflow-x:hidden;
}


/* =========================
   页面
========================= */

.page{
    width:min(100%,760px);
    min-height:100vh;
    margin:0 auto;
    padding:58px 24px 80px;
    text-align:center;
}

.title{
    margin:0;
    font-size:30px;
    font-weight:500;
    letter-spacing:3px;
}

.subtitle{
    margin-top:12px;
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:6px;
    color:#a58b82;
}


/* =========================
   信封区域
========================= */

.scene{
    position:relative;

    width:min(100%,620px);

    /*
       给信封和信纸足够空间，
       防止信纸打开后撞到标题
    */
    height:700px;

    margin:230px auto 0;
}


/* =========================
   信纸
========================= */

.letter{
    position:absolute;

    left:6%;
    top:25px;

    width:88%;
    min-height:500px;

    padding:42px 36px 38px;

    text-align:left;

    background:
        linear-gradient(
            rgba(255,253,247,.98),
            rgba(255,251,243,.98)
        );

    border:1px solid rgba(160,125,110,.13);

    border-radius:4px;

    box-shadow:
        0 14px 35px rgba(120,78,61,.12);

    /*
       最重要：
       关闭时整张信纸完全隐藏
    */
    opacity:0;
    visibility:hidden;

    transform:translateY(270px);

    z-index:1;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease,
        visibility 0s linear 1.05s;
}


/* 信纸内框 */

.letter:before{
    content:"";

    position:absolute;
    inset:10px;

    border:1px solid rgba(191,146,126,.14);

    pointer-events:none;
}


/* 打开后的信纸 */

.letter.opened{

    visibility:visible;
    opacity:1;

    /*
       向上移动到信封完全上方
    */
    transform:translateY(-455px);

    z-index:50;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
}


/* 信纸标题 */

.letter-title{
    text-align:center;

    font-size:18px;

    letter-spacing:4px;

    color:#96766c;

    margin:0 0 26px;
}


/* 信正文 */

.letter-body{
    font-size:18px;

    line-height:2.05;

    letter-spacing:1px;
}

.letter-body p{
    margin:0 0 25px;
}

.letter-body p:last-child{
    margin-bottom:0;
}


/* =========================
   信封
========================= */

.envelope{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:330px;

    z-index:20;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    filter:
        drop-shadow(
            0 18px 22px rgba(130,77,61,.15)
        );
}


/* 信封主体 */

.envelope-body{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:290px;

    background:#dc9279;

    border-radius:2px;

    overflow:hidden;

    z-index:22;
}


/* 左右折痕 */

.envelope-body:before,
.envelope-body:after{

    content:"";

    position:absolute;

    top:0;

    width:0;
    height:0;

    border-style:solid;
}

.envelope-body:before{

    left:0;

    border-width:
        290px
        310px
        0
        0;

    border-color:
        #e4a088
        transparent
        transparent
        transparent;
}

.envelope-body:after{

    right:0;

    border-width:
        290px
        0
        0
        310px;

    border-color:
        #d98b73
        transparent
        transparent
        transparent;
}


/* 下方折纸 */

.bottom-fold{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:205px;

    z-index:24;

    background:#e09a80;

    clip-path:
        polygon(
            0 100%,
            50% 0,
            100% 100%
        );
}


/* =========================
   信封上的文字
========================= */

.envelope-message{

    position:absolute;

    left:50%;
    top:105px;

    transform:translateX(-50%);

    width:80%;

    z-index:30;

    color:#fff8f3;

    font-size:21px;

    line-height:1.65;

    letter-spacing:2px;

    text-align:center;

    text-shadow:
        0 1px 2px rgba(112,64,52,.12);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =========================
   信封盖
========================= */

.flap{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:185px;

    z-index:40;

    background:#e8a48d;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:50% 0;

    transform:rotateX(0deg);

    transition:
        transform .85s cubic-bezier(.2,.75,.2,1);

    backface-visibility:hidden;
}


/* =========================
   印章
========================= */

.seal{

    position:absolute;

    left:50%;
    top:115px;

    transform:translateX(-50%);

    width:66px;
    height:66px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:#b6534c;

    color:#fff8f2;

    font-size:31px;

    z-index:45;

    box-shadow:
        0 5px 12px rgba(105,54,48,.22);

    transition:
        opacity .3s ease,
        transform .4s ease;
}


/* =========================
   打开动画
========================= */

.envelope.open .flap{

    transform:rotateX(180deg);
}

.envelope.open .envelope-message{

    opacity:0;

    transform:
        translateX(-50%)
        translateY(8px);
}

.envelope.open .seal{

    opacity:0;

    transform:
        translateX(-50%)
        scale(.65);
}


/* =========================
   点击提示
========================= */

.hint{

    position:absolute;

    left:50%;
    bottom:-42px;

    transform:translateX(-50%);

    color:#a98277;

    font-size:14px;

    letter-spacing:2px;

    transition:opacity .3s ease;
}

.scene.open .hint{
    opacity:0;
}


/* =========================
   重新关闭按钮
========================= */

.close{

    display:none;

    margin:20px auto 0;

    border:
        1px solid rgba(166,111,94,.3);

    background:
        rgba(255,250,245,.75);

    color:#8d675d;

    border-radius:20px;

    padding:8px 18px;

    font-size:13px;
}

.close.show{
    display:block;
}


/* =========================
   手机端
========================= */

@media(max-width:600px){

    .page{

        padding:
            34px
            18px
            70px;
    }

    .title{

        font-size:25px;

        letter-spacing:2px;
    }

    .subtitle{

        font-size:10px;

        letter-spacing:5px;
    }


    .scene{

        width:100%;

        height:690px;

        /*
           信封距离标题稍远，
           打开后信纸不会撞标题
        */
        margin-top:230px;
    }


    /* 手机端信纸 */

    .letter{

        left:4%;

        width:92%;

        min-height:500px;

        padding:
            35px
            25px
            32px;

        transform:
            translateY(260px);
    }


    .letter.opened{

        /*
           完整升到信封上方
        */
        transform:
            translateY(-435px);
    }


    .letter-title{

        font-size:16px;

        letter-spacing:3px;

        margin-bottom:22px;
    }


    .letter-body{

        font-size:17px;

        line-height:2.02;

        letter-spacing:.5px;
    }

    .letter-body p{

        margin-bottom:22px;
    }


    /* 手机信封 */

    .envelope{

        height:315px;
    }

    .envelope-body{

        height:275px;
    }

    .envelope-body:before{

        border-width:
            275px
            50vw
            0
            0;
    }

    .envelope-body:after{

        border-width:
            275px
            0
            0
            50vw;
    }


    .bottom-fold{

        height:195px;
    }


    .flap{

        height:175px;
    }


    .envelope-message{

        top:98px;

        font-size:18px;

        line-height:1.65;
    }


    .seal{

        top:108px;

        width:62px;

        height:62px;

        font-size:28px;
    }


    .hint{

        bottom:-40px;

        font-size:13px;
    }
}


/* 小屏手机 */

@media(max-width:390px){

    .letter{

        padding-left:21px;

        padding-right:21px;
    }

    .letter-body{

        font-size:16px;
    }

    .letter.opened{

        transform:
            translateY(-425px);
    }
}

</style>
</head>


<body>

<main class="page">

    <h1 class="title">
        教师节 · 给老师的一封信
    </h1>

    <div class="subtitle">
        THANK YOU, TEACHER
    </div>


    <section
        class="scene"
        id="scene"
    >


        <!-- =====================
             信纸
        ====================== -->

        <article
            class="letter"
            id="letter"
        >

            <div class="letter-title">
                写给老师
            </div>


            <div class="letter-body">

                <p>
                    老师，教师节快乐呀!!
                </p>


                <p>
                    上学期见不到您我们真的很想念您，还好大四又能上您的课了，我会好好听讲的😊
                </p>


                <p>
                    您无疑是我最喜欢的老师，当然我们许多人都会这么想的嘻嘻嘻
                </p>


                <p>
                    您以后有什么任务可以尽情吩咐我，我很开心能帮助到您❤️
                </p>


                <p>
                    愿您身体安康，平安幸福，教师节快乐！
                </p>

            </div>

        </article>



        <!-- =====================
             信封
        ====================== -->

        <div
            class="envelope"
            id="envelope"
            role="button"
            aria-label="点击打开信封"
        >

            <div class="envelope-body">

                <div class="bottom-fold"></div>


                <div class="envelope-message">

                    教师节快乐！<br>

                    祝您桃李满天下<br>

                    家庭事业顶呱呱

                </div>

            </div>


            <div class="flap"></div>


            <div class="seal">
                ✿
            </div>

        </div>


        <div class="hint">
            点击信封，打开这封信
        </div>

    </section>


    <button
        class="close"
        id="closeBtn"
    >
        重新合上信封
    </button>

</main>



<script>

const envelope =
    document.getElementById("envelope");

const letter =
    document.getElementById("letter");

const scene =
    document.getElementById("scene");

const closeBtn =
    document.getElementById("closeBtn");



/* =========================
   打开信封
========================= */

envelope.addEventListener(
    "click",
    function(){

        if(
            scene.classList.contains("open")
        ){
            return;
        }


        scene.classList.add("open");

        envelope.classList.add("open");


        /*
           先让信封盖打开，
           再让整张信纸出来
        */

        setTimeout(
            function(){

                letter.classList.add("opened");

            },
            450
        );


        setTimeout(
            function(){

                closeBtn.classList.add("show");

            },
            1500
        );

    }
);



/* =========================
   重新合上
========================= */

closeBtn.addEventListener(
    "click",
    function(){

        closeBtn.classList.remove("show");


        /*
           先把信纸收回去
        */

        letter.classList.remove("opened");


        setTimeout(
            function(){

                envelope.classList.remove("open");

                scene.classList.remove("open");

            },
            650
        );

    }
);

</script>

</body>
</html>
