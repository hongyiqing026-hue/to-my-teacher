<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>教师节 · 致亲爱的郑老师</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    color:#684f49;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,255,255,.96),
            rgba(255,247,238,.82) 45%,
            rgba(246,225,211,.98) 100%
        );

    overflow-x:hidden;
}


/* =====================================
   飘落花瓣
===================================== */

.petal-container{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    overflow:hidden;

    z-index:1;
}

.petal{
    position:absolute;

    top:-40px;

    width:14px;
    height:10px;

    background:rgba(224,157,139,.38);

    border-radius:
        100% 0 100% 0;

    transform:rotate(35deg);

    animation:
        fall linear infinite,
        sway ease-in-out infinite;

    filter:blur(.1px);
}


@keyframes fall{

    0%{
        top:-40px;
        opacity:0;
    }

    8%{
        opacity:.75;
    }

    85%{
        opacity:.6;
    }

    100%{
        top:110vh;
        opacity:0;
    }
}


@keyframes sway{

    0%{
        margin-left:0;
    }

    25%{
        margin-left:35px;
    }

    50%{
        margin-left:-25px;
    }

    75%{
        margin-left:30px;
    }

    100%{
        margin-left:0;
    }
}


/* =====================================
   页面
===================================== */

.page{
    position:relative;

    z-index:5;

    width:min(100%,760px);

    min-height:100vh;

    margin:0 auto;

    padding:
        58px
        24px
        80px;

    text-align:center;
}


.title{
    margin:0;

    font-size:30px;

    font-weight:500;

    letter-spacing:3px;
}


.subtitle{

    margin-top:12px;

    font-family:Arial,sans-serif;

    font-size:12px;

    letter-spacing:6px;

    color:#a58b82;
}


/* =====================================
   音乐按钮
===================================== */

.music-btn{

    margin-top:18px;

    padding:
        8px
        18px;

    border:
        1px solid
        rgba(166,111,94,.25);

    border-radius:20px;

    background:
        rgba(255,250,245,.72);

    color:#9b756a;

    font-family:
        "Noto Serif SC",
        "Songti SC",
        serif;

    font-size:12px;

    letter-spacing:1px;

    cursor:pointer;

    transition:
        background .3s ease,
        transform .2s ease,
        box-shadow .3s ease;

    display:none;
}


.music-btn:active{

    transform:scale(.96);
}


.music-btn.playing{

    background:
        rgba(226,160,140,.18);

    box-shadow:
        0 4px 15px
        rgba(160,100,80,.12);
}


/* =====================================
   信封场景
===================================== */

.scene{

    position:relative;

    width:min(100%,620px);

    height:700px;

    margin:
        210px
        auto
        0;
}


/* =====================================
   信纸
===================================== */

.letter{

    position:absolute;

    left:6%;

    top:25px;

    width:88%;

    min-height:500px;

    padding:
        42px
        36px
        38px;

    text-align:left;

    background:
        linear-gradient(
            rgba(255,253,247,.98),
            rgba(255,251,243,.98)
        );

    border:
        1px solid
        rgba(160,125,110,.13);

    border-radius:4px;

    box-shadow:
        0 14px 35px
        rgba(120,78,61,.12);

    opacity:0;

    visibility:hidden;

    transform:
        translateY(270px);

    z-index:1;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease,
        visibility 0s linear 1.05s;
}


/* 信纸内框 */

.letter:before{

    content:"";

    position:absolute;

    inset:10px;

    border:
        1px solid
        rgba(191,146,126,.14);

    pointer-events:none;
}


/* 打开后的信纸 */

.letter.opened{

    visibility:visible;

    opacity:1;

    transform:
        translateY(-455px);

    z-index:50;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
}


/* 信纸标题 */

.letter-title{

    text-align:center;

    font-size:18px;

    letter-spacing:4px;

    color:#96766c;

    margin:
        0
        0
        26px;
}


/* 正文 */

.letter-body{

    font-size:18px;

    line-height:2.05;

    letter-spacing:1px;
}


.letter-body p{

    margin:
        0
        0
        25px;
}


.letter-body p:last-child{

    margin-bottom:0;
}


/* =====================================
   信封
===================================== */

.envelope{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:330px;

    z-index:20;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    filter:
        drop-shadow(
            0 18px 22px
            rgba(130,77,61,.15)
        );
}


/* 信封主体 */

.envelope-body{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:290px;

    background:#dc9279;

    border-radius:2px;

    overflow:hidden;

    z-index:22;
}


/* 左侧折痕 */

.envelope-body:before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    width:0;

    height:0;

    border-style:solid;

    border-width:
        290px
        310px
        0
        0;

    border-color:
        #e4a088
        transparent
        transparent
        transparent;
}


/* 右侧折痕 */

.envelope-body:after{

    content:"";

    position:absolute;

    right:0;

    top:0;

    width:0;

    height:0;

    border-style:solid;

    border-width:
        290px
        0
        0
        310px;

    border-color:
        #d98b73
        transparent
        transparent
        transparent;
}


/* 下方折纸 */

.bottom-fold{

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    height:205px;

    z-index:24;

    background:#e09a80;

    clip-path:
        polygon(
            0 100%,
            50% 0,
            100% 100%
        );
}


/* =====================================
   信封文字
===================================== */

.envelope-message{

    position:absolute;

    left:50%;

    top:105px;

    transform:
        translateX(-50%);

    width:80%;

    z-index:30;

    color:#fff8f3;

    font-size:21px;

    line-height:1.65;

    letter-spacing:2px;

    text-align:center;

    text-shadow:
        0 1px 2px
        rgba(112,64,52,.12);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =====================================
   信封盖
===================================== */

.flap{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:185px;

    z-index:40;

    background:#e8a48d;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:50% 0;

    transform:
        rotateX(0deg);

    transition:
        transform .85s
        cubic-bezier(.2,.75,.2,1);

    backface-visibility:hidden;
}


/* =====================================
   印章
===================================== */

.seal{

    position:absolute;

    left:50%;

    top:115px;

    transform:
        translateX(-50%);

    width:66px;

    height:66px;

    border-radius:50%;

    display:grid;

    place-items:center;

    background:#b6534c;

    color:#fff8f2;

    font-size:31px;

    z-index:45;

    box-shadow:
        0 5px 12px
        rgba(105,54,48,.22);

    transition:
        opacity .3s ease,
        transform .4s ease;
}


/* =====================================
   打开状态
===================================== */

.envelope.open .flap{

    transform:
        rotateX(180deg);
}


.envelope.open .envelope-message{

    opacity:0;

    transform:
        translateX(-50%)
        translateY(8px);
}


.envelope.open .seal{

    opacity:0;

    transform:
        translateX(-50%)
        scale(.65);
}


/* =====================================
   点击提示
===================================== */

.hint{

    position:absolute;

    left:50%;

    bottom:-42px;

    transform:
        translateX(-50%);

    color:#a98277;

    font-size:14px;

    letter-spacing:2px;

    transition:
        opacity .3s ease;
}


.scene.open .hint{

    opacity:0;
}


/* =====================================
   重新关闭按钮
===================================== */

.close{

    display:none;

    margin:
        20px
        auto
        0;

    border:
        1px solid
        rgba(166,111,94,.3);

    background:
        rgba(255,250,245,.75);

    color:#8d675d;

    border-radius:20px;

    padding:
        8px
        18px;

    font-size:13px;
}


.close.show{

    display:block;
}


/* =====================================
   手机端
===================================== */

@media(max-width:600px){

    .page{

        padding:
            34px
            18px
            70px;
    }


    .title{

        font-size:25px;

        letter-spacing:2px;
    }


    .subtitle{

        font-size:10px;

        letter-spacing:5px;
    }


    .scene{

        width:100%;

        height:690px;

        margin-top:220px;
    }


    /* 手机信纸 */

    .letter{

        left:4%
