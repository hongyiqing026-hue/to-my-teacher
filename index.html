<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>教师节 · 致亲爱的刘老师</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.85), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(255,220,230,.55), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(255,240,220,.8), transparent 35%),
        linear-gradient(135deg,#fff8f2,#ffeef3,#fff7ed);

    color:#633f42;
    position:relative;
    min-height:100vh;
}

/* =========================
   背景装饰
========================= */

.bg-stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.star{
    position:absolute;
    color:#e6b6c0;
    font-size:18px;
    animation:
        twinkle 2.8s ease-in-out infinite,
        floatStar 6s ease-in-out infinite;
    opacity:.65;
}

.star:nth-child(1){left:8%;top:12%;animation-delay:.2s;}
.star:nth-child(2){left:18%;top:72%;font-size:13px;animation-delay:1s;}
.star:nth-child(3){left:82%;top:17%;font-size:14px;animation-delay:.6s;}
.star:nth-child(4){left:91%;top:64%;font-size:20px;animation-delay:1.4s;}
.star:nth-child(5){left:6%;top:42%;font-size:11px;animation-delay:2s;}
.star:nth-child(6){left:75%;top:78%;font-size:12px;animation-delay:1.2s;}
.star:nth-child(7){left:47%;top:7%;font-size:12px;animation-delay:1.7s;}
.star:nth-child(8){left:61%;top:87%;font-size:16px;animation-delay:.8s;}

@keyframes twinkle{
    0%,100%{
        opacity:.25;
        transform:scale(.8);
    }
    50%{
        opacity:1;
        transform:scale(1.25);
    }
}

@keyframes floatStar{
    0%,100%{
        margin-top:0;
    }
    50%{
        margin-top:-10px;
    }
}

/* =========================
   猫咪贴纸
========================= */

.cat-sticker{
    position:fixed;
    z-index:4;
    pointer-events:none;
    user-select:none;
    filter:drop-shadow(0 5px 5px rgba(130,80,90,.12));
}

.cat-left{
    left:13px;
    bottom:38px;
    font-size:54px;
    transform:rotate(-8deg);
    animation:catFloat 4s ease-in-out infinite;
}

.cat-right{
    right:13px;
    top:92px;
    font-size:48px;
    transform:rotate(8deg);
    animation:catFloat2 4.5s ease-in-out infinite;
}

@keyframes catFloat{
    0%,100%{transform:rotate(-8deg) translateY(0);}
    50%{transform:rotate(-5deg) translateY(-8px);}
}

@keyframes catFloat2{
    0%,100%{transform:rotate(8deg) translateY(0);}
    50%{transform:rotate(5deg) translateY(-7px);}
}

/* =========================
   飘落花瓣
========================= */

.petal-container{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:2;
}

.petal{
    position:absolute;
    top:-40px;
    width:13px;
    height:18px;
    background:rgba(245,170,185,.68);
    border-radius:70% 30% 70% 30%;
    transform:rotate(30deg);
    animation:
        fall linear infinite,
        sway ease-in-out infinite alternate;
}

@keyframes fall{
    from{
        transform:translateY(-40px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

@keyframes sway{
    from{
        margin-left:-30px;
    }
    to{
        margin-left:30px;
    }
}

/* =========================
   页面主体
========================= */

.page{
    width:100%;
    min-height:100vh;
    padding:65px 18px 40px;
    position:relative;
    z-index:3;
    text-align:center;
}

.title{
    font-size:30px;
    font-weight:600;
    letter-spacing:4px;
    color:#70464b;
    margin-bottom:12px;
    text-shadow:0 2px 5px rgba(120,70,80,.08);
}

.subtitle{
    font-size:13px;
    color:#a7777e;
    letter-spacing:2px;
}

/* =========================
   场景
========================= */

.scene{
    width:620px;
    max-width:100%;
    height:700px;
    margin:210px auto 0;
    position:relative;
}

/* =========================
   信纸
========================= */

.letter{
    position:absolute;
    width:410px;
    max-width:88%;
    height:570px;

    left:50%;
    bottom:160px;

    transform:
        translateX(-50%)
        translateY(270px);

    background:
        linear-gradient(
            rgba(255,255,255,.96),
            rgba(255,249,244,.97)
        );

    border-radius:8px;

    box-shadow:
        0 12px 35px rgba(115,65,75,.18),
        inset 0 0 0 1px rgba(190,130,140,.12);

    padding:45px 38px;

    opacity:0;
    z-index:2;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity .7s ease;
}

.letter::before{
    content:"";
    position:absolute;
    inset:12px;
    border:1px dashed rgba(198,145,153,.25);
    border-radius:5px;
    pointer-events:none;
}

.letter.opened{
    opacity:1;
    transform:
        translateX(-50%)
        translateY(-455px);
}

/* 信纸装饰星星 */

.letter-star{
    position:absolute;
    color:#e3aeb9;
    font-size:16px;
}

.letter-star.one{
    top:23px;
    left:25px;
}

.letter-star.two{
    top:25px;
    right:28px;
}

.letter-star.three{
    bottom:25px;
    left:28px;
}

.letter-star.four{
    bottom:22px;
    right:27px;
}

/* =========================
   信件内容
========================= */

.letter-content{
    position:relative;
    z-index:2;
    text-align:left;
    height:100%;
    overflow-y:auto;
    scrollbar-width:none;
}

.letter-content::-webkit-scrollbar{
    display:none;
}

.letter h2{
    text-align:center;
    font-size:23px;
    font-weight:600;
    margin-bottom:28px;
    color:#71464d;
}

.letter p{
    font-size:15px;
    line-height:2.15;
    margin-bottom:17px;
    color:#68484b;
    letter-spacing:.5px;
}

.letter .ending{
    text-align:right;
    margin-top:25px;
}

/* =========================
   信封
========================= */

.envelope{
    position:absolute;
    width:480px;
    max-width:90%;
    height:330px;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    z-index:4;

    transition:
        transform .6s ease,
        box-shadow .6s ease;
}

.envelope-body{
    position:absolute;
    inset:0;

    background:
        linear-gradient(135deg,#f5d3d7,#f8e0d7);

    border-radius:10px;

    box-shadow:
        0 18px 45px rgba(100,55,65,.18);

    overflow:hidden;
}

/* 信封下折 */

.bottom-fold{
    position:absolute;
    left:0;
    bottom:0;

    width:100%;
    height:190px;

    background:
        linear-gradient(
            145deg,
            transparent 49.5%,
            rgba(218,165,174,.48) 50%,
            transparent 50.5%
        ),
        linear-gradient(
            215deg,
            transparent 49.5%,
            rgba(218,165,174,.48) 50%,
            transparent 50.5%
        );

    pointer-events:none;
}

/* =========================
   信封文字
========================= */

.envelope-message{
    position:absolute;
    width:100%;
    top:115px;
    left:0;

    text-align:center;

    font-size:20px;
    letter-spacing:2px;
    color:#75474d;

    z-index:4;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.envelope-message::before{
    content:"✦";
    display:block;
    font-size:16px;
    margin-bottom:8px;
    color:#d79da9;
}

.envelope.open .envelope-message{
    opacity:0;
    transform:translateY(15px);
}

/* =========================
   信封上盖
========================= */

.flap{
    position:absolute;
    left:0;
    top:0;

    width:100%;
    height:180px;

    background:
        linear-gradient(
            145deg,
            #f8dfe2,
            #f3cbd1
        );

    clip-path:polygon(
        0 0,
        100% 0,
        50% 100%
    );

    transform-origin:top center;

    transition:
        transform .75s cubic-bezier(.4,0,.2,1);

    z-index:6;
}

.envelope.open .flap{
    transform:rotateX(180deg);
}

/* =========================
   印章
========================= */

.seal{
    position:absolute;

    left:50%;
    top:125px;

    transform:translateX(-50%);

    width:58px;
    height:58px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #e5a8b3 0 55%,
            #d68f9c 56% 100%
        );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;

    box-shadow:
        0 4px 10px rgba(120,60,70,.18);

    z-index:8;

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.envelope.open .seal{
    opacity:0;
    transform:
        translateX(-50%)
        scale(.6);
}

/* =========================
   小装饰
========================= */

.envelope-deco{
    position:absolute;
    color:#d79da7;
    z-index:5;
    font-size:17px;
}

.envelope-deco.left{
    left:28px;
    bottom:30px;
}

.envelope-deco.right{
    right:28px;
    bottom:30px;
}

/* =========================
   提示文字
========================= */

.hint{
    position:absolute;
    width:100%;
    bottom:-48px;
    left:0;

    font-size:13px;
    color:#a8787f;
    letter-spacing:1px;

    transition:opacity .5s ease;
}

.scene.open .hint{
    opacity:0;
}

/* =========================
   关闭按钮
========================= */

.close{
    position:fixed;
    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    padding:9px 22px;

    border:none;
    border-radius:20px;

    background:rgba(255,255,255,.75);

    color:#8c5c63;

    font-family:inherit;
    font-size:13px;

    box-shadow:
        0 5px 18px rgba(100,60,70,.12);

    display:none;
    z-index:20;

    backdrop-filter:blur(8px);
}

.close.show{
    display:block;
}

/* =========================
   手机适配
========================= */

@media(max-width:600px){

    .page{
        padding-top:55px;
    }

    .title{
        font-size:25px;
        letter-spacing:3px;
    }

    .subtitle{
        font-size:12px;
    }

    .scene{
        height:620px;
        margin-top:170px;
    }

    .envelope{
        height:275px;
    }

    .flap{
        height:150px;
    }

    .seal{
        top:105px;
        width:52px;
        height:52px;
        font-size:17px;
    }

    .envelope-message{
        top:92px;
        font-size:16px;
        padding:0 15px;
    }

    .letter{
        height:520px;
        padding:35px 27px;
        bottom:130px;
    }

    .letter.opened{
        transform:
            translateX(-50%)
            translateY(-395px);
    }

    .letter h2{
        font-size:21px;
        margin-bottom:23px;
    }

    .letter p{
        font-size:14px;
        line-height:2;
        margin-bottom:14px;
    }

    .cat-left{
        left:5px;
        bottom:75px;
        font-size:42px;
    }

    .cat-right{
        right:5px;
        top:100px;
        font-size:38px;
    }

    .hint{
        bottom:-40px;
        font-size:12px;
    }
}

@media(max-height:700px){

    .scene{
        margin-top:130px;
    }

    .page{
        padding-top:40px;
    }
}
</style>
</head>

<body>

<!-- =========================
     背景星星
========================= -->

<div class="bg-stars">
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">⋆</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">⋆</div>
</div>

<!-- =========================
     猫咪贴纸
========================= -->

<div class="cat-sticker cat-left">🐱</div>
<div class="cat-sticker cat-right">🐈</div>

<!-- =========================
     花瓣
========================= -->

<div class="petal-container" id="petals"></div>

<!-- =========================
     页面
========================= -->

<div class="page">

    <div class="title">
        致亲爱的刘老师
    </div>

    <div class="subtitle">
        一封来自学生的小小心意
    </div>

    <div class="scene" id="scene">

        <!-- =========================
             信纸
        ========================= -->

        <div class="letter" id="letter">

            <span class="letter-star one">✦</span>
            <span class="letter-star two">✧</span>
            <span class="letter-star three">⋆</span>
            <span class="letter-star four">✦</span>

            <div class="letter-content">

                <h2>亲爱的刘老师</h2>

                <p>
                    老师好，教师节快乐啊
                </p>

                <p>
                    感谢您一直以来的的教导，虽然我听的不咋认真，但我真切被您的责任心与真诚感染，所以笔译课我会好好听讲的（我尽力）
                </p>

                <p>
                    祝您身体健康，万事如意，教师节快乐！
                </p>

                <p class="ending">
                    —— 您的学生
                </p>

            </div>
        </div>


        <!-- =========================
             信封
        ========================= -->

        <div class="envelope" id="envelope">

            <div class="envelope-body">

                <div class="bottom-fold"></div>

                <div class="envelope-deco left">
                    ✦
                </div>

                <div class="envelope-deco right">
                    ✧
                </div>

                <div class="envelope-message">
                    教師の日おめでとうございます！ 🌸
                </div>

            </div>

            <div class="flap"></div>

            <div class="seal">
                祝
            </div>

        </div>


        <div class="hint">
            点击信封，打开这份小小的心意
        </div>

    </div>

</div>


<!-- =========================
     关闭按钮
========================= -->

<button class="close" id="closeBtn">
    收起信件
</button>


<script>

/* ==================================================
   1. 创建花瓣
================================================== */

const petalContainer =
    document.getElementById("petals");

for(let i = 0; i < 18; i++){

    const petal =
        document.createElement("div");

    petal.className = "petal";

    petal.style.left =
        Math.random() * 100 + "%";

    petal.style.animationDuration =
        (7 + Math.random() * 7) + "s";

    petal.style.animationDelay =
        (-Math.random() * 10) + "s";

    petal.style.opacity =
        (0.3 + Math.random() * 0.5);

    petal.style.transform =
        `scale(${0.6 + Math.random() * 0.7})`;

    petalContainer.appendChild(petal);
}


/* ==================================================
   2. 获取元素
================================================== */

const envelope =
    document.getElementById("envelope");

const letter =
    document.getElementById("letter");

const scene =
    document.getElementById("scene");

const closeBtn =
    document.getElementById("closeBtn");


/* ==================================================
   3. 信封打开
================================================== */

let opened = false;

envelope.addEventListener("click", function(){

    if(opened) return;

    opened = true;

    envelope.classList.add("open");
    scene.classList.add("open");

    /*
       延迟一点，让信封翻盖先打开，
       然后信纸再向上出现
    */

    setTimeout(function(){

        letter.classList.add("opened");

    },450);


    setTimeout(function(){

        closeBtn.classList.add("show");

    },1500);

});


/* ==================================================
   4. 关闭信件
================================================== */

closeBtn.addEventListener("click", function(e){

    e.stopPropagation();

    letter.classList.remove("opened");

    setTimeout(function(){

        envelope.classList.remove("open");
        scene.classList.remove("open");

        opened = false;

        closeBtn.classList.remove("show");

    },500);

});


/* ==================================================
   5. 背景音乐
      使用 Web Audio API
      不需要上传 MP3
================================================== */

let audioContext = null;
let musicTimer = null;
let musicStarted = false;


/*
   简单温柔的旋律

   数字越大音调越高
   0 = 停顿
*/

const melody = [

    523.25,659.25,783.99,659.25,
    587.33,523.25,440.00,0,

    523.25,659.25,783.99,880.00,
    783.99,659.25,587.33,0,

    523.25,587.33,659.25,783.99,
    659.25,587.33,523.25,0,

    440.00,523.25,587.33,659.25,
    587.33,523.25,440.00,0

];


/* ==================================================
   播放一个音符
================================================== */

function playNote(freq, duration){

    if(!audioContext || freq === 0){
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value =
        freq;

    /*
       柔和淡入淡出
    */

    const now =
        audioContext.currentTime;

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        0.045,
        now + 0.03
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);

    oscillator.stop(
        now + duration + 0.05
    );
}


/* ==================================================
   播放旋律
================================================== */

function playMelody(){

    if(!audioContext) return;

    let index = 0;

    function next(){

        if(!musicStarted) return;

        const freq =
            melody[index];

        playNote(
            freq,
            freq === 0 ? 0.25 : 0.42
        );

        index =
            (index + 1) % melody.length;

        musicTimer =
            setTimeout(next,420);
    }

    next();
}


/* ==================================================
   开始音乐
================================================== */

function startMusic(){

    if(musicStarted){
        return;
    }

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        /*
           如果 AudioContext 处于 suspended，
           resume 会在用户交互后恢复
        */

        const resumePromise =
            audioContext.resume();

        if(resumePromise &&
           typeof resumePromise.then === "function"){

            resumePromise.then(function(){

                if(!musicStarted){

                    musicStarted = true;

                    playMelody();

                }

            }).catch(function(){

                /*
                   浏览器拒绝时，
                   等第一次点击页面
                */

            });

        }else{

            musicStarted = true;
            playMelody();

        }

    }catch(error){

        console.log(
            "音乐启动失败：",
            error
        );

    }

}


/* ==================================================
   停止音乐
================================================== */

function stopMusic(){

    musicStarted = false;

    if(musicTimer){

        clearTimeout(musicTimer);

        musicTimer = null;

    }

}


/* ==================================================
   6. 页面进入后自动尝试播放
================================================== */

window.addEventListener(
    "load",
    function(){

        /*
           浏览器允许的话：
           进入页面立即播放

           浏览器不允许的话：
           不报错，不弹按钮，
           等第一次点击页面自动播放
        */

        startMusic();

    }
);


/* ==================================================
   7. 如果浏览器禁止自动播放
      第一次点击任意位置时自动开始

      不需要用户寻找音乐按钮
================================================== */

function firstInteraction(){

    startMusic();

    document.removeEventListener(
        "click",
        firstInteraction
    );

    document.removeEventListener(
        "touchstart",
        firstInteraction
    );

    document.removeEventListener(
        "pointerdown",
        firstInteraction
    );

}


/*
   微信 / 手机浏览器兼容
*/

document.addEventListener(
    "click",
    firstInteraction,
    {
        once:true
    }
);

document.addEventListener(
    "touchstart",
    firstInteraction,
    {
        once:true,
        passive:true
    }
);

document.addEventListener(
    "pointerdown",
    firstInteraction,
    {
        once:true
    }
);


/* ==================================================
   8. 微信环境兼容
================================================== */

document.addEventListener(
    "WeixinJSBridgeReady",
    function(){

        startMusic();

    },
    false
);

</script>

</body>
</html>
