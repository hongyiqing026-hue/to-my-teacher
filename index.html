<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>教师节 · 致亲爱的郑老师</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    color:#684f49;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,255,255,.96),
            rgba(255,247,238,.82) 45%,
            rgba(246,225,211,.98) 100%
        );

    overflow-x:hidden;
}


/* =====================================
   飘落花瓣
===================================== */

.petal-container{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    overflow:hidden;

    z-index:1;
}

.petal{
    position:absolute;

    top:-40px;

    width:14px;
    height:10px;

    background:rgba(224,157,139,.38);

    border-radius:
        100% 0 100% 0;

    transform:rotate(35deg);

    animation:
        fall linear infinite,
        sway ease-in-out infinite;

    filter:blur(.1px);
}


@keyframes fall{

    0%{
        top:-40px;
        opacity:0;
    }

    8%{
        opacity:.75;
    }

    85%{
        opacity:.6;
    }

    100%{
        top:110vh;
        opacity:0;
    }
}


@keyframes sway{

    0%{
        margin-left:0;
    }

    25%{
        margin-left:35px;
    }

    50%{
        margin-left:-25px;
    }

    75%{
        margin-left:30px;
    }

    100%{
        margin-left:0;
    }
}


/* =====================================
   页面
===================================== */

.page{
    position:relative;

    z-index:5;

    width:min(100%,760px);

    min-height:100vh;

    margin:0 auto;

    padding:
        58px
        24px
        80px;

    text-align:center;
}


.title{
    margin:0;

    font-size:30px;

    font-weight:500;

    letter-spacing:3px;
}


.subtitle{

    margin-top:12px;

    font-family:Arial,sans-serif;

    font-size:12px;

    letter-spacing:6px;

    color:#a58b82;
}


/* =====================================
   音乐按钮
===================================== */

.music-btn{

    margin-top:18px;

    padding:
        8px
        18px;

    border:
        1px solid
        rgba(166,111,94,.25);

    border-radius:20px;

    background:
        rgba(255,250,245,.72);

    color:#9b756a;

    font-family:
        "Noto Serif SC",
        "Songti SC",
        serif;

    font-size:12px;

    letter-spacing:1px;

    cursor:pointer;

    transition:
        background .3s ease,
        transform .2s ease,
        box-shadow .3s ease;
}


.music-btn:active{

    transform:scale(.96);
}


.music-btn.playing{

    background:
        rgba(226,160,140,.18);

    box-shadow:
        0 4px 15px
        rgba(160,100,80,.12);
}


/* =====================================
   信封场景
===================================== */

.scene{

    position:relative;

    width:min(100%,620px);

    height:700px;

    margin:
        210px
        auto
        0;
}


/* =====================================
   信纸
===================================== */

.letter{

    position:absolute;

    left:6%;

    top:25px;

    width:88%;

    min-height:500px;

    padding:
        42px
        36px
        38px;

    text-align:left;

    background:
        linear-gradient(
            rgba(255,253,247,.98),
            rgba(255,251,243,.98)
        );

    border:
        1px solid
        rgba(160,125,110,.13);

    border-radius:4px;

    box-shadow:
        0 14px 35px
        rgba(120,78,61,.12);

    opacity:0;

    visibility:hidden;

    transform:
        translateY(270px);

    z-index:1;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease,
        visibility 0s linear 1.05s;
}


/* 信纸内框 */

.letter:before{

    content:"";

    position:absolute;

    inset:10px;

    border:
        1px solid
        rgba(191,146,126,.14);

    pointer-events:none;
}


/* 打开后的信纸 */

.letter.opened{

    visibility:visible;

    opacity:1;

    transform:
        translateY(-455px);

    z-index:50;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
}


/* 信纸标题 */

.letter-title{

    text-align:center;

    font-size:18px;

    letter-spacing:4px;

    color:#96766c;

    margin:
        0
        0
        26px;
}


/* 正文 */

.letter-body{

    font-size:18px;

    line-height:2.05;

    letter-spacing:1px;
}


.letter-body p{

    margin:
        0
        0
        25px;
}


.letter-body p:last-child{

    margin-bottom:0;
}


/* =====================================
   信封
===================================== */

.envelope{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:330px;

    z-index:20;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    filter:
        drop-shadow(
            0 18px 22px
            rgba(130,77,61,.15)
        );
}


/* 信封主体 */

.envelope-body{

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:290px;

    background:#dc9279;

    border-radius:2px;

    overflow:hidden;

    z-index:22;
}


/* 左侧折痕 */

.envelope-body:before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    width:0;

    height:0;

    border-style:solid;

    border-width:
        290px
        310px
        0
        0;

    border-color:
        #e4a088
        transparent
        transparent
        transparent;
}


/* 右侧折痕 */

.envelope-body:after{

    content:"";

    position:absolute;

    right:0;

    top:0;

    width:0;

    height:0;

    border-style:solid;

    border-width:
        290px
        0
        0
        310px;

    border-color:
        #d98b73
        transparent
        transparent
        transparent;
}


/* 下方折纸 */

.bottom-fold{

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    height:205px;

    z-index:24;

    background:#e09a80;

    clip-path:
        polygon(
            0 100%,
            50% 0,
            100% 100%
        );
}


/* =====================================
   信封文字
===================================== */

.envelope-message{

    position:absolute;

    left:50%;

    top:105px;

    transform:
        translateX(-50%);

    width:80%;

    z-index:30;

    color:#fff8f3;

    font-size:21px;

    line-height:1.65;

    letter-spacing:2px;

    text-align:center;

    text-shadow:
        0 1px 2px
        rgba(112,64,52,.12);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =====================================
   信封盖
===================================== */

.flap{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:185px;

    z-index:40;

    background:#e8a48d;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:50% 0;

    transform:
        rotateX(0deg);

    transition:
        transform .85s
        cubic-bezier(.2,.75,.2,1);

    backface-visibility:hidden;
}


/* =====================================
   印章
===================================== */

.seal{

    position:absolute;

    left:50%;

    top:115px;

    transform:
        translateX(-50%);

    width:66px;

    height:66px;

    border-radius:50%;

    display:grid;

    place-items:center;

    background:#b6534c;

    color:#fff8f2;

    font-size:31px;

    z-index:45;

    box-shadow:
        0 5px 12px
        rgba(105,54,48,.22);

    transition:
        opacity .3s ease,
        transform .4s ease;
}


/* =====================================
   打开状态
===================================== */

.envelope.open .flap{

    transform:
        rotateX(180deg);
}


.envelope.open .envelope-message{

    opacity:0;

    transform:
        translateX(-50%)
        translateY(8px);
}


.envelope.open .seal{

    opacity:0;

    transform:
        translateX(-50%)
        scale(.65);
}


/* =====================================
   点击提示
===================================== */

.hint{

    position:absolute;

    left:50%;

    bottom:-42px;

    transform:
        translateX(-50%);

    color:#a98277;

    font-size:14px;

    letter-spacing:2px;

    transition:
        opacity .3s ease;
}


.scene.open .hint{

    opacity:0;
}


/* =====================================
   重新关闭按钮
===================================== */

.close{

    display:none;

    margin:
        20px
        auto
        0;

    border:
        1px solid
        rgba(166,111,94,.3);

    background:
        rgba(255,250,245,.75);

    color:#8d675d;

    border-radius:20px;

    padding:
        8px
        18px;

    font-size:13px;
}


.close.show{

    display:block;
}


/* =====================================
   手机端
===================================== */

@media(max-width:600px){

    .page{

        padding:
            34px
            18px
            70px;
    }


    .title{

        font-size:25px;

        letter-spacing:2px;
    }


    .subtitle{

        font-size:10px;

        letter-spacing:5px;
    }


    .scene{

        width:100%;

        height:690px;

        margin-top:220px;
    }


    /* 手机信纸 */

    .letter{

        left:4%;

        width:92%;

        min-height:500px;

        padding:
            35px
            25px
            32px;

        transform:
            translateY(260px);
    }


    .letter.opened{

        transform:
            translateY(-435px);
    }


    .letter-title{

        font-size:16px;

        letter-spacing:3px;

        margin-bottom:22px;
    }


    .letter-body{

        font-size:17px;

        line-height:2.02;

        letter-spacing:.5px;
    }


    .letter-body p{

        margin-bottom:22px;
    }


    /* 手机信封 */

    .envelope{

        height:315px;
    }


    .envelope-body{

        height:275px;
    }


    .envelope-body:before{

        border-width:
            275px
            50vw
            0
            0;
    }


    .envelope-body:after{

        border-width:
            275px
            0
            0
            50vw;
    }


    .bottom-fold{

        height:195px;
    }


    .flap{

        height:175px;
    }


    .envelope-message{

        top:98px;

        font-size:18px;

        line-height:1.65;
    }


    .seal{

        top:108px;

        width:62px;

        height:62px;

        font-size:28px;
    }


    .hint{

        bottom:-40px;

        font-size:13px;
    }


    .petal{

        width:11px;

        height:8px;
    }
}


/* =====================================
   小屏手机
===================================== */

@media(max-width:390px){

    .letter{

        padding-left:21px;

        padding-right:21px;
    }


    .letter-body{

        font-size:16px;
    }


    .letter.opened{

        transform:
            translateY(-425px);
    }
}

</style>
</head>


<body>


<!-- =====================================
     花瓣
===================================== -->

<div
    class="petal-container"
    id="petals">
</div>



<main class="page">


    <!-- 标题 -->

    <h1 class="title">
        教师节 · 致亲爱的郑老师
    </h1>


    <div class="subtitle">
        THANK YOU, TEACHER
    </div>


    <!-- 音乐按钮 -->

    <button
        class="music-btn"
        id="musicBtn">

        ♫ 轻音乐 · 点击开启

    </button>



    <!-- =================================
         信封区域
    ================================== -->

    <section
        class="scene"
        id="scene">


        <!-- =============================
             信纸
        ============================== -->

        <article
            class="letter"
            id="letter">


            <div class="letter-title">

                亲爱的老师

            </div>



            <div class="letter-body">


                <p>
                    老师，教师节快乐呀!!
                </p>


                <p>
                    上学期见不到您我们真的很想念您，还好大四又能上您的课了，我会好好听讲的😊
                </p>


                <p>
                    您无疑是我最喜欢的老师，当然我们许多人都会这么想的嘻嘻嘻
                </p>


                <p>
                    您以后有什么任务可以尽情吩咐我，我很开心能帮助到您❤️
                </p>


                <p>
                    愿您身体安康，平安幸福，教师节快乐！
                </p>


            </div>

        </article>



        <!-- =============================
             信封
        ============================== -->

        <div
            class="envelope"
            id="envelope"
            role="button"
            aria-label="点击打开信封">


            <div class="envelope-body">


                <div class="bottom-fold">
                </div>


                <div class="envelope-message">

                    教师节快乐！<br>

                    祝您桃李满天下<br>

                    家庭事业顶呱呱

                </div>


            </div>



            <div class="flap">
            </div>



            <div class="seal">

                ✿

            </div>


        </div>



        <div class="hint">

            点击信封，打开这封信

        </div>


    </section>



    <!-- 关闭按钮 -->

    <button
        class="close"
        id="closeBtn">

        重新合上信封

    </button>


</main>



<script>


/* =====================================
   创建花瓣
===================================== */

const petalContainer =
    document.getElementById("petals");


const petalCount = 18;


for(
    let i = 0;
    i < petalCount;
    i++
){

    const petal =
        document.createElement("span");


    petal.className =
        "petal";


    /* 随机位置 */

    petal.style.left =
        Math.random() * 100 + "%";


    /* 随机大小 */

    const scale =
        0.65 +
        Math.random() * 0.75;


    petal.style.transform =
        `rotate(${Math.random()*360}deg) scale(${scale})`;


    /* 随机速度 */

    const fallTime =
        8 +
        Math.random() * 9;


    petal.style.animationDuration =
        `${fallTime}s, ${3 + Math.random()*3}s`;


    /* 随机延迟 */

    petal.style.animationDelay =
        `${-Math.random()*12}s, ${-Math.random()*3}s`;


    /* 随机透明度 */

    petal.style.opacity =
        0.35 +
        Math.random() * 0.4;


    petalContainer.appendChild(
        petal
    );
}



/* =====================================
   获取元素
===================================== */

const envelope =
    document.getElementById("envelope");

const letter =
    document.getElementById("letter");

const scene =
    document.getElementById("scene");

const closeBtn =
    document.getElementById("closeBtn");

const musicBtn =
    document.getElementById("musicBtn");



/* =====================================
   信封打开
===================================== */

envelope.addEventListener(
    "click",
    function(){

        if(
            scene.classList.contains("open")
        ){

            return;

        }


        scene.classList.add("open");

        envelope.classList.add("open");


        /*
           先打开信封盖，
           再让信纸升起来
        */

        setTimeout(
            function(){

                letter.classList.add(
                    "opened"
                );

            },
            450
        );


        setTimeout(
            function(){

                closeBtn.classList.add(
                    "show"
                );

            },
            1500
        );


        /*
           如果音乐还没有播放，
           点击信封时自动恢复
        */

        if(!musicPlaying){

            startMusic();

        }

    }
);



/* =====================================
   重新合上
===================================== */

closeBtn.addEventListener(
    "click",
    function(){

        closeBtn.classList.remove(
            "show"
        );


        /*
           先收回信纸
        */

        letter.classList.remove(
            "opened"
        );


        setTimeout(
            function(){

                envelope.classList.remove(
                    "open"
                );

                scene.classList.remove(
                    "open"
                );

            },
            650
        );

    }
);



/* =====================================
   原创舒缓音乐
===================================== */

let audioContext =
    null;

let musicPlaying =
    false;

let musicTimer =
    null;

let musicStep =
    0;


/*
   C大调原创旋律
*/

const melody = [

    523.25,
    659.25,
    783.99,
    659.25,

    587.33,
    698.46,
    880.00,
    698.46,

    523.25,
    659.25,
    783.99,
    987.77,

    880.00,
    783.99,
    659.25,
    523.25,

    440.00,
    523.25,
    659.25,
    783.99,

    698.46,
    659.25,
    523.25,
    440.00

];



/* =====================================
   播放单音
===================================== */

function playNote(
    frequency,
    duration
){

    if(!audioContext){

        return;

    }


    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    /*
       正弦波让声音比较柔和
    */

    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );


    /*
       淡入
    */

    gain.gain.setValueAtTime(
        0,
        now
    );


    gain.gain.linearRampToValueAtTime(
        0.055,
        now + 0.08
    );


    /*
       淡出
    */

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        audioContext.destination
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now + duration
    );

}



/* =====================================
   播放旋律
===================================== */

function playMelody(){

    if(!musicPlaying){

        return;

    }


    const note =
        melody[musicStep];


    playNote(
        note,
        1.8
    );


    musicStep =
        (
            musicStep + 1
        )
        %
        melody.length;


    musicTimer =
        setTimeout(
            playMelody,
            1600
        );

}



/* =====================================
   开始音乐
===================================== */

function startMusic(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    if(musicPlaying){

        return;

    }


    musicPlaying =
        true;


    musicBtn.classList.add(
        "playing"
    );


    musicBtn.textContent =
        "♫ 轻音乐 · 播放中";


    musicStep =
        0;


    playMelody();

}



/* =====================================
   停止音乐
===================================== */

function stopMusic(){

    musicPlaying =
        false;


    clearTimeout(
        musicTimer
    );


    musicBtn.classList.remove(
        "playing"
    );


    musicBtn.textContent =
        "♫ 轻音乐 · 点击开启";

}



/* =====================================
   音乐按钮
===================================== */

musicBtn.addEventListener(
    "click",
    function(){

        if(musicPlaying){

            stopMusic();

        }
        else{

            startMusic();

        }

    }
);



/* =====================================
   自动播放音乐
===================================== */

/*
   页面一进入就尝试播放。
   
   注意：
   手机浏览器、微信等环境可能禁止
   网页在没有用户操作的情况下播放声音。
   
   如果被浏览器拦截，则第一次点击页面
   任意位置时自动恢复音乐，不需要点击
   音乐按钮。
*/

window.addEventListener(
    "load",
    function(){

        startMusic();

    }
);


/*
   如果浏览器阻止了自动播放，
   用户第一次点击页面时自动恢复。
*/

function resumeMusicOnInteraction(){

    if(
        !musicPlaying ||
        !audioContext
    ){

        startMusic();

    }

}


document.addEventListener(
    "click",
    resumeMusicOnInteraction,
    {
        once:true
    }
);


document.addEventListener(
    "touchstart",
    resumeMusicOnInteraction,
    {
        once:true,
        passive:true
    }
);


document.addEventListener(
    "pointerdown",
    resumeMusicOnInteraction,
    {
        once:true
    }
);

</script>

</body>
</html>
