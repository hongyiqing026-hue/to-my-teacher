<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师节 · 给老师的一封信</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background:
        radial-gradient(circle at 50% 20%, #fffaf0 0%, #f7eee3 45%, #ead9c9 100%);
    color: #5d493d;
}

/* 整个场景 */
.scene {
    width: 100%;
    height: 100vh;
    min-height: 600px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* 背景装饰 */
.scene::before,
.scene::after {
    content: "✿";
    position: absolute;
    font-size: 90px;
    color: rgba(173, 112, 87, 0.10);
}

.scene::before {
    left: 8%;
    top: 12%;
    transform: rotate(-20deg);
}

.scene::after {
    right: 8%;
    bottom: 12%;
    transform: rotate(20deg);
}

/* 标题 */
.title {
    position: absolute;
    top: 8%;
    text-align: center;
    z-index: 20;
}

.title-main {
    font-family: serif;
    font-size: 28px;
    letter-spacing: 5px;
    color: #684b3d;
}

.title-sub {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 4px;
    color: #a58270;
}

/* 信封整体 */
.envelope {
    width: min(360px, 82vw);
    height: 240px;
    position: relative;
    cursor: pointer;
    perspective: 1200px;
    margin-top: 50px;
}

/* 信纸 */
.letter {
    position: absolute;
    width: 88%;
    height: 260px;
    left: 6%;
    top: -10px;

    background:
        linear-gradient(
            rgba(255,255,255,0.5),
            rgba(255,255,255,0.5)
        ),
        #fffdf8;

    border-radius: 3px;
    padding: 28px 25px;

    box-shadow:
        0 12px 30px rgba(87, 59, 43, 0.15);

    z-index: 2;

    transform: translateY(60px);
    transition:
        transform 1.15s cubic-bezier(.22,.61,.36,1);

    overflow: hidden;
}

/* 信纸顶部小装饰 */
.letter::before {
    content: "✿";
    position: absolute;
    right: 18px;
    top: 12px;
    color: #b8836d;
    font-size: 17px;
    opacity: .7;
}

.letter-title {
    text-align: center;
    font-family: serif;
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 18px;
    color: #63483b;
}

.letter-content {
    font-family: serif;
    font-size: 15px;
    line-height: 1.9;
    color: #66534a;

    /* 你可以在这里修改文字 */
    white-space: pre-wrap;
}

/* 信封主体 */
.envelope-body {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 180px;

    background:
        linear-gradient(135deg, #d9a58d, #c98d75);

    border-radius: 8px;

    box-shadow:
        0 18px 35px rgba(85, 54, 40, 0.20);

    z-index: 5;
}

/* 左右折痕 */
.fold-left {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 50%;
    height: 180px;
    z-index: 7;

    background: #d39a81;

    clip-path: polygon(
        0 0,
        100% 100%,
        0 100%
    );
}

.fold-right {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 50%;
    height: 180px;
    z-index: 7;

    background: #cf947b;

    clip-path: polygon(
        100% 0,
        100% 100%,
        0 100%
    );
}

/* 信封上盖 */
.flap {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 145px;

    background: #dfad96;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );

    transform-origin: 50% 0%;
    transition:
        transform 1s cubic-bezier(.22,.61,.36,1);

    z-index: 10;

    filter: drop-shadow(
        0 3px 4px rgba(85, 54, 40, .10)
    );
}

/* 上盖打开 */
.envelope.open .flap {
    transform: rotateX(180deg);
}

/* 信纸升起 */
.envelope.open .letter {
    transform: translateY(-190px);
    z-index: 6;
}

/* 火漆印 */
.seal {
    position: absolute;
    width: 52px;
    height: 52px;
    left: 50%;
    top: 100px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #b97062,
            #914f47
        );

    color: #f9e8d7;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;

    box-shadow:
        0 4px 8px rgba(73, 40, 34, .22);

    z-index: 12;

    transition:
        opacity .35s ease,
        transform .5s ease;
}

/* 打开以后火漆印消失 */
.envelope.open .seal {
    opacity: 0;
    transform:
        translateX(-50%)
        scale(.7);
}

/* 提示文字 */
.hint {
    position: absolute;
    bottom: 9%;
    font-size: 13px;
    letter-spacing: 2px;
    color: #9a7968;
    transition: opacity .4s;
}

.envelope.open + .hint {
    opacity: 0;
}

/* 手机适配 */
@media (max-width: 500px) {

    .title {
        top: 7%;
    }

    .title-main {
        font-size: 23px;
        letter-spacing: 3px;
    }

    .title-sub {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .envelope {
        width: 84vw;
        height: 220px;
    }

    .envelope-body {
        height: 165px;
    }

    .fold-left,
    .fold-right {
        height: 165px;
    }

    .flap {
        height: 130px;
    }

    .seal {
        top: 88px;
        width: 48px;
        height: 48px;
    }

    .letter {
        height: 245px;
        padding: 24px 20px;
    }

    .letter-title {
        font-size: 18px;
    }

    .letter-content {
        font-size: 14px;
        line-height: 1.8;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="title">
        <div class="title-main">教师节 · 给老师的一封信</div>
        <div class="title-sub">THANK YOU, TEACHER</div>
    </div>

    <div class="envelope" id="envelope">

        <!-- =========================
             信的内容从这里修改
             ========================= -->
        <div class="letter">

            <div class="letter-title">
                老师，您好
            </div>

            <div class="letter-content">这里写你想对老师说的话。

老师，教师节快乐！

感谢您一直以来的教导和帮助。
愿您每天都能开心顺利，也希望您在未来的日子里，一切都好。

—— 您的学生</div>

        </div>

        <!-- 信封主体 -->
        <div class="envelope-body"></div>

        <!-- 折痕 -->
        <div class="fold-left"></div>
        <div class="fold-right"></div>

        <!-- 信封上盖 -->
        <div class="flap"></div>

        <!-- 火漆印 -->
        <div class="seal">✿</div>

    </div>

    <div class="hint">
        点击信封，打开这封信
    </div>

</div>

<script>

const envelope = document.getElementById("envelope");

envelope.addEventListener("click", function () {
    envelope.classList.toggle("open");
});

</script>

</body>
</html>
